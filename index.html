</style>

function calcSt(grp){const ts=G[grp].t.map((n,i)=>({n,i,pts:0,pj:0,gf:0,gc:0}));G[grp].m.forEach((m,mi)=>{const sc=scores[grp+'_'+mi];if(!sc)return;const h=m[0],a=m[1],hg=sc[0],ag=sc[1];ts[h].pj++;ts[a].pj++;ts[h].gf+=hg;ts[h].gc+=ag;ts[a].gf+=ag;ts[a].gc+=hg;if(hg>ag)ts[h].pts+=3;else if(hg<ag)ts[a].pts+=3;else{ts[h].pts++;ts[a].pts++;}});return ts.sort((a,b)=>b.pts-a.pts||(b.gf-b.gc)-(a.gf-a.gc)||b.gf-a.gf);}

function calcPh(){const bp=[[],[],[],[],[]];Object.keys(G).forEach(g=>{calcSt(g).forEach((t,pi)=>bp[pi].push({...t,grp:g}));});const sf=(a,b)=>b.pts-a.pts||(b.gf-b.gc)-(a.gf-a.gc)||b.gf-a.gf;bp[2].sort(sf);bp[4].sort(sf);const ph={};bp[0].forEach(t=>ph[t.grp+'_'+t.i]='oro');bp[1].forEach(t=>ph[t.grp+'_'+t.i]='oro');bp[2].slice(0,2).forEach(t=>ph[t.grp+'_'+t.i]='oro');bp[2].slice(2).forEach(t=>ph[t.grp+'_'+t.i]='plata');bp[3].forEach(t=>ph[t.grp+'_'+t.i]='plata');bp[4].slice(0,4).forEach(t=>ph[t.grp+'_'+t.i]='plata');bp[4].slice(4,12).forEach(t=>ph[t.grp+'_'+t.i]='bronce');bp[4].slice(12).forEach(t=>ph[t.grp+'_'+t.i]='copa');return ph;}

function fmtM(grp,mi){const m=G[grp].m[mi],hn=G[grp].t[m[0]],an=G[grp].t[m[1]],sc=scores[grp+'_'+mi];const day=m[2]===0?'Vie 29':'Sáb 30',hasR=hn===R||an===R;return'<div class="mc'+(hasR?' mr':'')+'" onclick="openM(\''+grp+'\','+mi+')"><div class="mr-row"><span class="mt'+(hn===R?' r':'')+'">'+hn+'</span><span class="ms '+(sc!=null?'played':'pending')+'">'+(sc!=null?sc[0]:'–')+'</span><span class="msep">–</span><span class="ms '+(sc!=null?'played':'pending')+'">'+(sc!=null?sc[1]:'–')+'</span><span class="mt'+(an===R?' r':'')+'" style="text-align:right">'+an+'</span></div><div class="mm">📅 '+day+' · ⏰ '+m[3]+' · 📍 '+m[4]+'</div></div>';}

function fmtSt(grp){const st=calcSt(grp);let h='<table class="st"><tr><th style="width:40%">Equipo</th><th>PJ</th><th>PTS</th><th>GF</th><th>GC</th><th>DG</th></tr>';st.forEach(function(t,pi){const dg=t.gf-t.gc,pc=pi===0?'g':pi===1?'s':pi===2?'b':'x';h+='<tr class="'+(t.n===R?'ret':'')+'"><td><span class="pos '+pc+'">'+(pi+1)+'</span>'+t.n+'</td><td>'+t.pj+'</td><td><b>'+t.pts+'</b></td><td>'+t.gf+'</td><td>'+t.gc+'</td><td>'+(dg>0?'+'+dg:dg)+'</td></tr>';});return h+'</table>';}

function renderMyTeam(){const st=calcSt('K'),ri=G.K.t.indexOf(R),rpos=st.findIndex(function(t){return t.i===ri}),rs=st[rpos],dg=rs.gf-rs.gc;const ph=calcPh(),myph=ph['K_'+ri]||'---';const rms=G.K.m.map(function(m,i){return{m:m,i:i}}).filter(function(x){return G.K.t[x.m[0]]===R||G.K.t[x.m[1]]===R});let h='<div class="hero"><div class="hero-top"><div><div class="hero-name">SD Retuerto</div><div class="hero-grp">Grupo K · <span class="fb '+fbcls(myph)+'">'+myph.toUpperCase()+'</span></div></div><div style="text-align:right"><div class="hero-pos">'+(rpos+1)+'º</div><div class="hero-pos-label">clasificación</div></div></div><div class="stats-row"><div class="stat-box"><div class="stat-lbl">PUNTOS</div><div class="stat-val">'+rs.pts+'</div></div><div class="stat-box"><div class="stat-lbl">PJ</div><div class="stat-val">'+rs.pj+'</div></div><div class="stat-box"><div class="stat-lbl">GOLES</div><div class="stat-val">'+rs.gf+':'+rs.gc+'</div></div><div class="stat-box"><div class="stat-lbl">DG</div><div class="stat-val">'+(dg>0?'+'+dg:dg)+'</div></div></div></div>';h+='<div class="sh">Partidos de Retuerto</div>';rms.forEach(function(x){h+=fmtM('K',x.i);});h+='<div class="sh">Clasificación Grupo K</div>'+fmtSt('K');return h;}

function renderGroups(){const gks=Object.keys(G);let sel='<select class="gsel" onchange="curGroup=this.value;render()">';gks.forEach(function(g){sel+='<option value="'+g+'"'+(g===curGroup?' selected':'')+'>'+(G[g].t.some(function(t){return t===R})?'⭐ ':'')+'Grupo '+g+'</option>';});sel+='</select>';let h=sel+'<div class="sh">Clasificación</div>'+fmtSt(curGroup)+'<div class="sh">Partidos</div>';G[curGroup].m.forEach(function(_,i){h+=fmtM(curGroup,i);});return h;}

function renderFases(){const ph=calcPh(),ri=G.K.t.indexOf(R),myph=ph['K_'+ri]||'---';const st=calcSt('K'),rpos=st.findIndex(function(t){return t.i===ri});const thirds=[];Object.keys(G).forEach(function(g){const s=calcSt(g);thirds.push({n:s[2].n,gf:s[2].gf,gc:s[2].gc,pts:s[2].pts,grp:g});});thirds.sort(function(a,b){return b.pts-a.pts||(b.gf-b.gc)-(a.gf-a.gc)||b.gf-a.gf;});let h='<div class="hero" style="margin-bottom:10px"><div style="font-size:10px;color:var(--hint);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px">SD Retuerto · fase proyectada</div><div style="display:flex;align-items:center;justify-content:space-between"><span class="fb '+fbcls(myph)+'" style="font-size:15px;padding:6px 16px">'+myph.toUpperCase()+'</span><span style="font-size:12px;color:var(--muted)">'+(rpos+1)+'º en Grupo K</span></div></div>';h+='<div class="sh">Ranking mejores 3eros (top 2 → Oro)</div><div class="card" style="padding:8px 10px">';thirds.forEach(function(t,idx){const isR=t.grp==='K'&&t.n===R,dg=t.gf-t.gc;h+='<div class="thirds-row'+(isR?' ret':'')+'"><span style="font-size:10px;min-width:18px;color:'+(idx<2?'var(--green)':'var(--hint)')+';font-weight:'+(idx<2?'700':'400')+'">'+(idx+1)+'º</span><span style="font-size:12px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+t.n+'</span><span style="font-size:10px;color:var(--hint);margin:0 4px">'+t.grp+'</span><span style="font-size:11px;font-weight:600">'+t.pts+'pts</span><span style="font-size:10px;color:var(--hint);min-width:28px;text-align:right">'+(dg>=0?'+'+dg:dg)+'</span></div>';});h+='</div>';h+='<div class="sh">Resumen por grupos</div>';Object.keys(G).forEach(function(g){const gst=calcSt(g);h+='<div class="grp-card"><div class="grp-card-t">Grupo '+g+'</div>';gst.forEach(function(t,pi){const pk=g+'_'+t.i,pn=ph[pk]||'',isR=t.n===R;h+='<div class="grp-team" style="'+(isR?'color:var(--red);font-weight:600':'')+'"><span style="font-size:9px;min-width:14px;color:var(--hint)">'+(pi+1)+'.</span><span style="font-size:11px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+t.n+'</span><span class="fb '+fbcls(pn)+'" style="font-size:8px">'+(pn||'--')+'</span></div>';});h+='</div>';});return h;}

function renderCruces(){
 const phases=['oro','plata','bronce','copa'];
 const phLabels={oro:'Fase Oro',plata:'Fase Plata',bronce:'Fase Bronce',copa:'Copa Torrelavega'};
 const phCls={oro:'pt-oro',plata:'pt-plata',bronce:'pt-bronce',copa:'pt-copa'};
 let h='<button class="add-btn" onclick="openAddCruce()">＋ Añadir partido eliminatoria</button>';
 if(cruces.length===0){h+='<div class="ko-empty">Aún no hay cruces añadidos.<br>Pulsa el botón de arriba cuando la organización publique los cruces.</div>';return h;}
 phases.forEach(function(phase){
  const matches=cruces.filter(function(c){return c.phase===phase;});
  if(matches.length===0)return;
  h+='<div class="phase-tag '+phCls[phase]+'">'+phLabels[phase]+' ('+matches.length+' partidos)</div>';
  matches.forEach(function(c,i){
   const idx=cruces.indexOf(c);
   const hasR=c.home===R||c.away===R;
   const sc=c.score;
   h+='<div class="mc'+(hasR?' mr':'')+'" onclick="openCruceScore('+idx+')">';
   h+='<div class="mr-row"><span class="mt'+(c.home===R?' r':'')+'">'+c.home+'</span>';
   h+='<span class="ms '+(sc?'played':'pending')+'">'+(sc?sc[0]:'–')+'</span>';
   h+='<span class="msep">–</span>';
   h+='<span class="ms '+(sc?'played':'pending')+'">'+(sc?sc[1]:'–')+'</span>';
   h+='<span class="mt'+(c.away===R?' r':'')+'" style="text-align:right">'+c.away+'</span></div>';
   h+='<div class="mm">🏆 '+(c.round||'')+' · ⏰ '+(c.time||'?')+' · 📍 '+(c.venue||'?')+'</div></div>';
  });
 });
 return h;
}

function render(){
 document.querySelectorAll('.tab').forEach(function(el,i){el.classList.toggle('on',i===curTab);});
 const el=document.getElementById('content');
 if(curTab===0)el.innerHTML=renderMyTeam();
 else if(curTab===1)el.innerHTML=renderGroups();
 else if(curTab===2)el.innerHTML=renderFases();
 else el.innerHTML=renderCruces();
 el.scrollTop=0;
}

// --- Group match score modal ---
window.sTab=function(t){curTab=t;render();};
window.openM=function(g,i){
 modal={type:'group',grp:g,mi:parseInt(i)};
 const m=G[g].m[i],hn=G[g].t[m[0]],an=G[g].t[m[1]],sc=scores[g+'_'+i];
 const tr=function(n){return n.length>13?n.slice(0,13)+'…':n;};
 document.getElementById('mbox-inner').innerHTML='<div class="mbt">Grupo '+g+' · Resultado</div><div class="mbs">'+hn+' – '+an+'</div><div class="sinps"><div><div class="slbl">'+tr(hn)+'</div><input type="number" min="0" max="99" class="sinp" id="mh" value="'+(sc?sc[0]:0)+'" inputmode="numeric"></div><span class="svs">–</span><div><div class="slbl">'+tr(an)+'</div><input type="number" min="0" max="99" class="sinp" id="ma" value="'+(sc?sc[1]:0)+'" inputmode="numeric"></div></div><div class="brow"><button class="mbtn" onclick="closeM()">Cancelar</button>'+(sc?'<button class="mbtn dl" onclick="delGroupSc()">Borrar</button>':'')+'<button class="mbtn sv" onclick="saveGroupSc()">Guardar</button></div>';
 document.getElementById('modal').classList.add('show');
 setTimeout(function(){document.getElementById('mh').select();},100);
};
window.closeM=function(){document.getElementById('modal').classList.remove('show');modal=null;};
window.saveGroupSc=function(){
 const h=Math.max(0,parseInt(document.getElementById('mh').value)||0);
 const a=Math.max(0,parseInt(document.getElementById('ma').value)||0);
 scores[modal.grp+'_'+modal.mi]=[h,a];save();closeM();render();
};
window.delGroupSc=function(){delete scores[modal.grp+'_'+modal.mi];save();closeM();render();};

// --- Add knockout match modal ---
window.openAddCruce=function(){
 modal={type:'addCruce'};
 let opts='';ALL_TEAMS.forEach(function(t){opts+='<option value="'+t+'"></option>';});
 document.getElementById('mbox-inner').innerHTML='<div class="mbt">Nuevo cruce</div><div class="mbs">Añade un partido de eliminatorias</div><div class="field"><label>Fase</label><select id="cr-phase"><option value="oro">Fase Oro</option><option value="plata">Fase Plata</option><option value="bronce">Fase Bronce</option><option value="copa">Copa Torrelavega</option></select></div><div class="field"><label>Ronda</label><select id="cr-round"><option value="Dieciseisavos">Dieciseisavos</option><option value="Octavos">Octavos</option><option value="Cuartos">Cuartos</option><option value="Semifinal">Semifinal</option><option value="3er puesto">3er puesto</option><option value="Final">Final</option></select></div><datalist id="teams-list">'+opts+'</datalist><div class="field"><label>Equipo local</label><input id="cr-home" list="teams-list" placeholder="Escribe nombre..." autocomplete="off"></div><div class="field"><label>Equipo visitante</label><input id="cr-away" list="teams-list" placeholder="Escribe nombre..." autocomplete="off"></div><div class="field-row"><div class="field"><label>Hora</label><input id="cr-time" type="time" value="12:00"></div><div class="field"><label>Campo</label><input id="cr-venue" placeholder="Ej: Polanco"></div></div><div class="brow" style="margin-top:16px"><button class="mbtn" onclick="closeM()">Cancelar</button><button class="mbtn sv" onclick="saveCruce()">Añadir</button></div>';
 document.getElementById('modal').classList.add('show');
};
window.saveCruce=function(){
 const home=document.getElementById('cr-home').value.trim();
 const away=document.getElementById('cr-away').value.trim();
 if(!home||!away){alert('Escribe los dos equipos');return;}
 cruces.push({
  phase:document.getElementById('cr-phase').value,
  round:document.getElementById('cr-round').value,
  home:home,away:away,
  time:document.getElementById('cr-time').value,
  venue:document.getElementById('cr-venue').value.trim(),
  score:null
 });
 saveCruces();closeM();render();
};

// --- Knockout match score modal ---
window.openCruceScore=function(idx){
 modal={type:'cruceScore',idx:idx};
 const c=cruces[idx],sc=c.score;
 const tr=function(n){return n.length>13?n.slice(0,13)+'…':n;};
 document.getElementById('mbox-inner').innerHTML='<div class="mbt">'+c.round+' · Resultado</div><div class="mbs">'+c.home+' – '+c.away+'</div><div class="sinps"><div><div class="slbl">'+tr(c.home)+'</div><input type="number" min="0" max="99" class="sinp" id="mh" value="'+(sc?sc[0]:0)+'" inputmode="numeric"></div><span class="svs">–</span><div><div class="slbl">'+tr(c.away)+'</div><input type="number" min="0" max="99" class="sinp" id="ma" value="'+(sc?sc[1]:0)+'" inputmode="numeric"></div></div><div class="brow"><button class="mbtn" onclick="closeM()">Cancelar</button>'+(sc?'<button class="mbtn dl" onclick="delCruceScore()">Borrar</button>':'')+'<button class="mbtn dl" onclick="delCruce()">Eliminar partido</button><button class="mbtn sv" onclick="saveCruceScore()">Guardar</button></div>';
 document.getElementById('modal').classList.add('show');
 setTimeout(function(){document.getElementById('mh').select();},100);
};
window.saveCruceScore=function(){
 const h=Math.max(0,parseInt(document.getElementById('mh').value)||0);
 const a=Math.max(0,parseInt(document.getElementById('ma').value)||0);
 cruces[modal.idx].score=[h,a];saveCruces();closeM();render();
};
window.delCruceScore=function(){cruces[modal.idx].score=null;saveCruces();closeM();render();};
window.delCruce=function(){if(confirm('¿Eliminar este partido?')){cruces.splice(modal.idx,1);saveCruces();closeM();render();}};

load();render();
</script>
</body>
</html>
