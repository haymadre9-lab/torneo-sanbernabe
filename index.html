*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#121212;--bg2:#1a1a1a;--bg3:#222;--card:#1e1e1e;--gold:#c9a227;--red:#E24B4A;--red-dim:#7f1d1d;--text:#f0f0f0;--muted:#999;--hint:#666;--border:rgba(255,255,255,.08);--green:#4ade80;--blue:#a5b4fc;--orange:#fdba74;--r:10px;--font:'DM Sans',system-ui,sans-serif}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font);-webkit-tap-highlight-color:transparent;overflow:hidden}
#app{max-width:430px;margin:0 auto;height:100dvh;display:flex;flex-direction:column}
.hdr{background:linear-gradient(135deg,#1a1700 0%,#1c1c1c 60%);padding:14px 18px;border-bottom:1px solid var(--border);flex-shrink:0}
.hdr-t{font-size:15px;font-weight:600;color:var(--gold);letter-spacing:.3px}
.hdr-s{font-size:11px;color:var(--muted);margin-top:1px}
.tabs{display:flex;gap:3px;background:var(--bg2);padding:4px;margin:8px 12px;border-radius:var(--r);border:1px solid var(--border);flex-shrink:0}
.tab{flex:1;padding:8px 4px;border-radius:7px;border:none;background:transparent;font-size:12px;font-weight:500;cursor:pointer;color:var(--hint);font-family:var(--font);transition:.15s}
.tab.on{background:var(--bg3);color:var(--gold);box-shadow:0 1px 4px rgba(0,0,0,.3)}
.content{flex:1;overflow-y:auto;padding:0 12px 20px;-webkit-overflow-scrolling:touch}
.content::-webkit-scrollbar{width:3px}
.content::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.sh{font-size:10px;font-weight:600;color:var(--hint);text-transform:uppercase;letter-spacing:.6px;margin:14px 0 6px;padding-left:2px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;margin-bottom:8px}
.mc{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:9px 12px;margin-bottom:5px;cursor:pointer;transition:.12s;-webkit-user-select:none;user-select:none}
.mc:active{transform:scale(.98);opacity:.8}
.mc.mr{border-color:var(--red-dim);background:rgba(226,75,74,.04)}
.mr-row{display:flex;align-items:center;gap:6px}
.mt{font-size:12px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mt.r{color:var(--red);font-weight:600}
.ms{font-size:16px;font-weight:600;min-width:20px;text-align:center}
.ms.played{color:var(--text)}.ms.pending{color:var(--hint)}
.msep{font-size:12px;color:var(--hint)}
.mm{font-size:10px;color:var(--hint);margin-top:3px}
.st{width:100%;font-size:11px;border-collapse:collapse;margin-bottom:8px}
.st th{color:var(--hint);font-weight:500;padding:4px 3px;text-align:center;border-bottom:1px solid var(--border);font-size:9px;text-transform:uppercase;letter-spacing:.3px}
.st th:first-child{text-align:left}
.st td{padding:5px 3px;text-align:center;border-bottom:1px solid var(--border)}
.st td:first-child{text-align:left}
.st tr.ret td{color:var(--red);font-weight:600}
.pos{display:inline-flex;width:16px;height:16px;border-radius:4px;align-items:center;justify-content:center;font-size:9px;font-weight:600;margin-right:4px;flex-shrink:0}
.pos.g{background:rgba(74,222,128,.12);color:var(--green)}.pos.s{background:rgba(165,180,252,.1);color:var(--blue)}.pos.b{background:rgba(253,186,116,.1);color:var(--orange)}.pos.x{background:rgba(248,113,113,.08);color:#f87171}

.grp-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:8px 11px;margin-bottom:6px}
.grp-card-t{font-size:10px;font-weight:600;color:var(--muted);margin-bottom:5px;letter-spacing:.3px}
.grp-team{display:flex;align-items:center;gap:5px;padding:2px 0}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:100;display:none;align-items:center;justify-content:center;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.overlay.show{display:flex}
.mbox{background:var(--card);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:22px 26px;width:280px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.mbt{font-size:14px;font-weight:600;margin-bottom:4px;text-align:center}
.mbs{font-size:10px;color:var(--muted);text-align:center;margin-bottom:16px}
.sinps{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:20px}
.slbl{font-size:10px;text-align:center;color:var(--muted);margin-bottom:4px;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sinp{width:60px;padding:8px;text-align:center;font-size:22px;font-weight:700;border:1px solid var(--border);border-radius:8px;background:var(--bg2);color:var(--text);font-family:var(--font);transition:.2s}
.sinp:focus{border-color:var(--gold);outline:none;box-shadow:0 0 0 3px rgba(201,162,39,.15)}
.svs{font-size:20px;color:var(--hint);margin-top:16px}
.brow{display:flex;gap:6px}
.mbtn{flex:1;padding:10px 4px;border:1px solid var(--border);border-radius:8px;background:transparent;cursor:pointer;font-size:12px;font-weight:500;color:var(--text);font-family:var(--font);transition:.12s}
.mbtn:active{transform:scale(.96)}
.mbtn.sv{background:rgba(74,222,128,.1);border-color:rgba(74,222,128,.25);color:var(--green)}
.mbtn.dl{color:#f87171;border-color:rgba(248,113,113,.2)}
@media(min-width:431px){#app{border-left:1px solid var(--border);border-right:1px solid var(--border)}}
</style>
</head>

let scores={},curTab=0,curGroup='K',modal=null;
function load(){try{const d=localStorage.getItem('sb26');if(d)scores=JSON.parse(d);}catch(e){}}

function calcSt(grp){const ts=G[grp].t.map((n,i)=>({n,i,pts:0,pj:0,gf:0,gc:0}));G[grp].m.forEach((m,mi)=>{const sc=scores[grp+'_'+mi];if(!sc)return;const h=m[0],a=m[1],hg=sc[0],ag=sc[1];ts[h].pj++;ts[a].pj++;ts[h].gf+=hg;ts[h].gc+=ag;ts[a].gf+=ag;ts[a].gc+=hg;if(hg>ag)ts[h].pts+=3;else if(hg<ag)ts[a].pts+=3;else{ts[h].pts++;ts[a].pts++;}});return ts.sort((a,b)=>b.pts-a.pts||(b.gf-b.gc)-(a.gf-a.gc)||b.gf-a.gf);}
function calcPh(){const bp=[[],[],[],[],[]];Object.keys(G).forEach(g=>{calcSt(g).forEach((t,pi)=>bp[pi].push({...t,grp:g}));});const sf=(a,b)=>b.pts-a.pts||(b.gf-b.gc)-(a.gf-a.gc)||b.gf-a.gf;bp[2].sort(sf);bp[4].sort(sf);const ph={};bp[0].forEach(t=>ph[t.grp+'_'+t.i]='oro');bp[1].forEach(t=>ph[t.grp+'_'+t.i]='oro');bp[2].slice(0,2).forEach(t=>ph[t.grp+'_'+t.i]='oro');bp[2].slice(2).forEach(t=>ph[t.grp+'_'+t.i]='plata');bp[3].forEach(t=>ph[t.grp+'_'+t.i]='plata');bp[4].slice(0,4).forEach(t=>ph[t.grp+'_'+t.i]='plata');bp[4].slice(4,12).forEach(t=>ph[t.grp+'_'+t.i]='bronce');bp[4].slice(12).forEach(t=>ph[t.grp+'_'+t.i]='copa');return ph;}
function fbcls(p){return p==='oro'?'fo':p==='plata'?'fp':p==='bronce'?'fbr':'fc';}
function fmtM(grp,mi){const m=G[grp].m[mi],hn=G[grp].t[m[0]],an=G[grp].t[m[1]],sc=scores[grp+'_'+mi];const day=m[2]===0?'Vie 29':'Sáb 30',hasR=hn===R||an===R;return`<div class="mc${hasR?' mr':''}" onclick="openM('${grp}',${mi})"><div class="mr-row"><span class="mt${hn===R?' r':''}">${hn}</span><span class="ms ${sc!=null?'played':'pending'}">${sc!=null?sc[0]:'–'}</span><span class="msep">–</span><span class="ms ${sc!=null?'played':'pending'}">${sc!=null?sc[1]:'–'}</span><span class="mt${an===R?' r':''}" style="text-align:right">${an}</span></div><div class="mm">📅 ${day} · ⏰ ${m[3]} · 📍 ${m[4]}</div></div>`;}
function fmtSt(grp){const st=calcSt(grp);let h=`<table class="st"><tr><th style="width:40%">Equipo</th><th>PJ</th><th>PTS</th><th>GF</th><th>GC</th><th>DG</th></tr>`;st.forEach((t,pi)=>{const dg=t.gf-t.gc,pc=pi===0?'g':pi===1?'s':pi===2?'b':'x';h+=`<tr class="${t.n===R?'ret':''}"><td><span class="pos ${pc}">${pi+1}</span>${t.n}</td><td>${t.pj}</td><td><b>${t.pts}</b></td><td>${t.gf}</td><td>${t.gc}</td><td>${dg>0?'+'+dg:dg}</td></tr>`;});return h+'</table>';}
function renderMyTeam(){const st=calcSt('K'),ri=G.K.t.indexOf(R),rpos=st.findIndex(t=>t.i===ri),rs=st[rpos],dg=rs.gf-rs.gc;const ph=calcPh(),myph=ph['K_'+ri]||'---';const rms=G.K.m.map((m,i)=>({m,i})).filter(x=>G.K.t[x.m[0]]===R||G.K.t[x.m[1]]===R);return`<div class="hero"><div class="hero-top"><div><div class="hero-name">SD Retuerto</div><div class="hero-grp">Grupo K · <span class="fb ${fbcls(myph)}">${myph.toUpperCase()}</span></div></div><div style="text-align:right"><div class="hero-pos">${rpos+1}º</div><div class="hero-pos-label">clasificación</div></div></div><div class="stats-row"><div class="stat-box"><div class="stat-lbl">PUNTOS</div><div class="stat-val">${rs.pts}</div></div><div class="stat-box"><div class="stat-lbl">PJ</div><div class="stat-val">${rs.pj}</div></div><div class="stat-box"><div class="stat-lbl">GOLES</div><div class="stat-val">${rs.gf}:${rs.gc}</div></div><div class="stat-box"><div class="stat-lbl">DG</div><div class="stat-val">${dg>0?'+'+dg:dg}</div></div></div></div><div class="sh">Partidos de Retuerto</div>${rms.map(x=>fmtM('K',x.i)).join('')}<div class="sh">Clasificación Grupo K</div>${fmtSt('K')}`;}
function renderGroups(){const gks=Object.keys(G);let sel=`<select class="gsel" onchange="curGroup=this.value;render()">${gks.map(g=>`<option value="${g}"${g===curGroup?' selected':''}>${G[g].t.some(t=>t===R)?'⭐ ':''}Grupo ${g}</option>`).join('')}</select>`;return sel+`<div class="sh">Clasificación</div>${fmtSt(curGroup)}<div class="sh">Partidos</div>${G[curGroup].m.map((_,i)=>fmtM(curGroup,i)).join('')}`;}
function renderFases(){const ph=calcPh(),ri=G.K.t.indexOf(R),myph=ph['K_'+ri]||'---';const st=calcSt('K'),rpos=st.findIndex(t=>t.i===ri);const thirds=[];Object.keys(G).forEach(g=>{const s=calcSt(g);thirds.push({...s[2],grp:g});});thirds.sort((a,b)=>b.pts-a.pts||(b.gf-b.gc)-(a.gf-a.gc)||b.gf-a.gf);let h=`<div class="hero" style="margin-bottom:10px"><div style="font-size:10px;color:var(--hint);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px">SD Retuerto · fase proyectada</div><div style="display:flex;align-items:center;justify-content:space-between"><span class="fb ${fbcls(myph)}" style="font-size:15px;padding:6px 16px">${myph.toUpperCase()}</span><span style="font-size:12px;color:var(--muted)">${rpos+1}º en Grupo K</span></div></div><div class="sh">Ranking mejores 3eros (top 2 → Oro)</div><div class="card" style="padding:8px 10px">`;thirds.forEach((t,ri)=>{const isR=t.grp==='K'&&t.n===R,dg=t.gf-t.gc;h+=`<div class="thirds-row${isR?' ret':''}"><span style="font-size:10px;min-width:18px;color:${ri<2?'var(--green)':'var(--hint)'};font-weight:${ri<2?'700':'400'}">${ri+1}º</span><span style="font-size:12px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${t.n}</span><span style="font-size:10px;color:var(--hint);margin:0 4px">${t.grp}</span><span style="font-size:11px;font-weight:600">${t.pts}pts</span><span style="font-size:10px;color:var(--hint);min-width:28px;text-align:right">${dg>=0?'+'+dg:dg}</span></div>`;});h+='</div><div class="sh">Resumen por grupos</div>';Object.keys(G).forEach(g=>{const gst=calcSt(g);h+=`<div class="grp-card"><div class="grp-card-t">Grupo ${g}</div>`;gst.forEach((t,pi)=>{const pk=g+'_'+t.i,pn=ph[pk]||'',isR=t.n===R;h+=`<div class="grp-team" style="${isR?'color:var(--red);font-weight:600':''}"><span style="font-size:9px;min-width:14px;color:var(--hint)">${pi+1}.</span><span style="font-size:11px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${t.n}</span><span class="fb ${fbcls(pn)}" style="font-size:8px">${pn||'--'}</span></div>`;});h+='</div>';});return h;}
function render(){document.querySelectorAll('.tab').forEach((el,i)=>el.classList.toggle('on',i===curTab));const el=document.getElementById('content');if(curTab===0)el.innerHTML=renderMyTeam();else if(curTab===1)el.innerHTML=renderGroups();else el.innerHTML=renderFases();el.scrollTop=0;}
window.sTab=t=>{curTab=t;render();};
window.openM=(g,i)=>{modal={grp:g,mi:parseInt(i)};const m=G[g].m[i],hn=G[g].t[m[0]],an=G[g].t[m[1]],sc=scores[g+'_'+i];document.getElementById('m-title').textContent='Grupo '+g+' · Resultado';document.getElementById('m-sub').textContent=hn+' – '+an;document.getElementById('m-hl').textContent=hn.length>13?hn.slice(0,13)+'…':hn;document.getElementById('m-al').textContent=an.length>13?an.slice(0,13)+'…':an;document.getElementById('mh').value=sc?sc[0]:0;document.getElementById('ma').value=sc?sc[1]:0;document.getElementById('btn-del').style.display=sc?'block':'none';document.getElementById('modal').classList.add('show');setTimeout(()=>document.getElementById('mh').select(),100);};
window.closeM=()=>{document.getElementById('modal').classList.remove('show');modal=null;};
window.saveSc=()=>{const h=Math.max(0,parseInt(document.getElementById('mh').value)||0);const a=Math.max(0,parseInt(document.getElementById('ma').value)||0);scores[modal.grp+'_'+modal.mi]=[h,a];save();closeM();render();};
window.delSc=()=>{delete scores[modal.grp+'_'+modal.mi];save();closeM();render();};
load();render();
</script>
</body>
</html>
